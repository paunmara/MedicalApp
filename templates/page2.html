{% extends "base.html" %}

{% block content %}
<div class = "dashboard-container page2">
    <h2> Observație - Secțiunea 2</h2>

    <form method = "post">
        <div class = "form-group page2">
            <label>Apă Curentă:</label>
            <input type = "hidden" name = "apa_curenta" id="apa_curenta" value ="">
            <div class = "button-group">
                <button type = "button" class = "choice-btn" data-input = "apa_curenta" data-value = "Da">Da</button>
                <button type = "button" class = "choice-btn" data-input = "apa_curenta" data-value = "Nu">Nu</button>
            </div>
        </div>

        <div class = "form-group">
            <label>Săpun Lichid:</label>
            <input type = "hidden" name = "sapun_lichid" id="sapun_lichid" value ="">
            <div class = "button-group">
                <button type = "button" class = "choice-btn" data-input = "sapun_lichid" data-value = "Da">Da</button>
                <button type = "button" class = "choice-btn" data-input = "sapun_lichid" data-value = "Nu">Nu</button>
            </div>
        </div>

        <div class = "form-group">
            <label>Prosoape de Hârtie:</label>
            <input type = "hidden" name = "prosop_hartie" id="prosop_hartie" value ="">
            <div class = "button-group">
                <button type = "button" class = "choice-btn" data-input = "prosop_hartie" data-value = "Da">Da</button>
                <button type = "button" class = "choice-btn" data-input = "prosop_hartie" data-value = "Nu">Nu</button>
            </div>
        </div>

        <div class = "form-group">
            <label>Dezinfectant:</label>
            <input type = "hidden" name = "dezinfectant" id="dezinfectant" value ="">
            <div class = "button-group">
                <button type = "button" class = "choice-btn" data-input = "dezinfectant" data-value = "Da">Da</button>
                <button type = "button" class = "choice-btn" data-input = "dezinfectant" data-value = "Nu">Nu</button>
            </div>
        </div>

        <div class = "form-group">
            <label>Pictograme:</label>
            <input type = "hidden" name = "pictograme" id="pictograme" value ="">
            <div class = "button-group">
                <button type = "button" class = "choice-btn" data-input = "pictograme" data-value = "Da">Da</button>
                <button type = "button" class = "choice-btn" data-input = "pictograme" data-value = "Nu">Nu</button>
            </div>
        </div>

        <div class = "form-group">
            <label>Pregatirea Mâinilor:</label>
            <input type = "hidden" name = "pregatire_maini" id="pregatire_maini" value ="">
            <div class = "button-group">
                <button type = "button" class = "choice-btn" data-input = "pregatire_maini" data-value = "Unghii">Unghii</button>
                <button type = "button" class = "choice-btn" data-input = "pregatire_maini" data-value = "Lac">Lac</button>
                <button type = "button" class = "choice-btn" data-input = "pregatire_maini" data-value = "Bijuterii">Bijuterii</button>
                <button type = "button" class = "choice-btn" data-input = "pregatire_maini" data-value = "Nimic">Nimic</button>
            </div>
        </div>

        <div class="form-navigation">
            <button type="submit" class="continue-btn">Continuă</button>
        </div>
    </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    console.log("PAGE 2 DOM READY");

    const buttons = document.querySelectorAll(".choice-btn");
    console.log("Found buttons:", buttons.length);

    buttons.forEach(button => {
        button.addEventListener("click", () => {
            const inputId = button.dataset.input;
            if (!inputId) return;

            const value = button.dataset.value;

            console.log("Clicked:", inputId, value);

            const hiddenInput = document.getElementById(inputId);
            if (!hiddenInput) {
                console.error("Hidden input not found:", inputId);
                return;
            }

            hiddenInput.value = value;

            const group = button.parentElement;
            group.querySelectorAll(".choice-btn")
                 .forEach(b => b.classList.remove("active-choice"));

            button.classList.add("active-choice");
        });
    });
});

console.log("PAGE 2 JS LOADED");
</script>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<div class = "login-container">
    <h2>Creați Utilizator Nou</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method = "post" action = "/users/new">
        <div class = "form-group">
            <label>Introduceți Username</label>
            <input name = "username" type = "text" required>
        </div>
        <div class = "form-group">
            <label>Introduceți Parolă</label>
            <input name = "password" type = "password" required>
        </div>

        <div class="form-navigation">
          <button type="submit" class="continue-btn">Creează Cont</button>
        </div>
        <div class="form-footer" style="margin-top: 1rem; text-align: center;">
             <a href="/login" style="font-size: 0.9rem; color: #666;">Înapoi la Logare</a>
        </div>
    </form>
</div>

{% endblock %}

{% extends "base.html" %}

{% block content %}

<div class="login-container">
  <h2>Login</h2>

  {% if error %}
    <div class = "error">{{ error }}</div>
  {% endif %}

  <form method = "post" action = "/login">
    <div class = "form-group">
      <label for = "username">Username</label>
        <input id = "username" name = "username" type = "text" required>
    </div>
    <div class = "form group">
        <label for = "password">Parolă</label>
        <input id = "password" name = "password" type = "password" required>
    </div>
    <div class="form-navigation">
          <button type="submit" class="continue-btn">Log in</button>
    </div>

    <div class="secondary-group" style="border-top: 1px solid #eee; padding-top: 1.5rem;">
        <p style="font-size: 0.9rem; margin-bottom: 1rem;">Nu aveți un cont?</p>
        <a href="/users/new" class="action-btn">Creează Utilizator Nou</a>
    </div>
  </form>
</div>

{% endblock %}
